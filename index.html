<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noche Duo</title>
<meta name="theme-color" content="#0d0b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noche Duo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column over a living night sky; each screen is a stack of glass cards */
:root {
  --sky: #0d0b1f;
  --sky-2: #1a1638;
  --ink: #f4eee4;
  --muted: #a9a3c4;
  --gold: #f0c674;
  --rose: #ff7a93;
  --flame: #ff9a3c;
  --card: rgba(255,255,255,0.06);
  --line: rgba(240,198,116,0.28);
  --ok: #7fe0a7;
  --bad: #ff8a8a;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--sky-2), var(--sky) 70%);
  background-color: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
#stars, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#stars { z-index: 0; }
#fx { z-index: 50; }
.wrap { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; padding: 18px 18px 48px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 1.2rem; background: none; border: 0; color: var(--ink); padding: 0; cursor: pointer; }
.brand svg { transition: transform .4s ease; }
.brand:active svg { transform: rotate(-20deg) scale(1.1); }
.hdr-right { display: flex; align-items: center; gap: 8px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; color: var(--muted); font: 500 0.8rem var(--body); padding: 6px 11px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--gold); color: var(--sky); }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--gold); display: grid; place-items: center; cursor: pointer; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.2rem; line-height: 1.08; margin: 10px 0 0; text-wrap: balance; }
h1 em { font-style: italic; color: var(--gold); font-weight: 500; }
h2 { font-family: var(--display); font-weight: 500; font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0; font-weight: 700; }
.tag { color: var(--muted); margin: 6px 0 0; font-size: 1.02rem; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(4px); }
ol.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
ol.rules li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
ol.rules b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold); color: var(--gold); font-family: var(--display); font-size: 0.95rem; }
.btn { appearance: none; border: 0; border-radius: 14px; padding: 15px 18px; font: 700 1rem var(--body); cursor: pointer; width: 100%; transition: transform .08s ease, opacity .2s, box-shadow .3s; }
.btn:active { transform: scale(0.97); }
.btn:focus-visible, .lang button:focus-visible, .choice:focus-visible, input:focus-visible, .seal:focus-visible, .icon-btn:focus-visible, .brand:focus-visible, .yn button:focus-visible, .chips button:focus-visible, .switch:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn-gold { background: var(--gold); color: var(--sky); box-shadow: 0 6px 24px -8px rgba(240,198,116,0.6); }
.btn-rose { background: var(--rose); color: #2a0712; box-shadow: 0 6px 24px -8px rgba(255,122,147,0.6); }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.code { font-family: var(--display); font-size: 3.4rem; letter-spacing: 0.18em; text-align: center; color: var(--gold); margin: 4px 0; font-variant-numeric: tabular-nums; }
.small { font-size: 0.88rem; color: var(--muted); margin: 0; }
.center { text-align: center; }
input.codein, input.txt { width: 100%; background: rgba(0,0,0,0.25); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); font: 400 1rem var(--body); padding: 12px 14px; }
input.codein { color: var(--gold); font: 500 2.2rem var(--display); letter-spacing: 0.3em; text-align: center; font-variant-numeric: tabular-nums; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-size: 0.8rem; font-weight: 700; background: rgba(255,122,147,0.15); color: var(--rose); }

/* Profile card */
.couple { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.names { font-family: var(--display); font-size: 1.2rem; line-height: 1.2; }
.names .heart { color: var(--rose); padding: 0 4px; }
.flame { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--flame); font-variant-numeric: tabular-nums; }
.flame svg { filter: drop-shadow(0 0 6px rgba(255,154,60,0.6)); }
.flame.out { color: var(--muted); }
.flame.out svg { filter: none; opacity: .5; }
.level-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.9rem; }
.level-row b { font-family: var(--display); font-size: 1.05rem; color: var(--gold); font-weight: 500; }
.bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--rose), var(--gold)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.badges { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.badges .badge { font-size: 1.05rem; border-radius: 10px; }
.badge { padding: 0; cursor: pointer; color: inherit; font-family: inherit; aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-size: 1.25rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); filter: grayscale(1); opacity: .35; }
.badge.on { filter: none; opacity: 1; border-color: var(--line); background: rgba(240,198,116,0.1); }
.badge-names { font-size: 0.78rem; color: var(--muted); margin: 0; min-height: 1.2em; }

/* Envelope */
.seal { position: relative; border: 1px dashed var(--gold); border-radius: 16px; min-height: 180px; display: grid; place-items: center; padding: 22px; text-align: center; cursor: pointer; background: rgba(240,198,116,0.05); color: var(--ink); font: inherit; width: 100%; perspective: 800px; }
.seal.closed { animation: glow 2.6s ease-in-out infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(240,198,116,0); } 50% { box-shadow: 0 0 28px -4px rgba(240,198,116,0.45); } }
.env { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); }
.env svg { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.open { display: flex; flex-direction: column; gap: 12px; align-items: center; animation: unfold .55s cubic-bezier(.2,.9,.3,1.2); transform-origin: top center; }
@keyframes unfold { from { transform: rotateX(-80deg) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.mission-text { font-family: var(--display); font-size: 1.45rem; line-height: 1.3; text-wrap: balance; }

.timer { font-family: var(--display); font-size: 2.4rem; text-align: center; font-variant-numeric: tabular-nums; }
.timer.done { color: var(--rose); animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.chips { display: flex; gap: 8px; justify-content: center; }
.chips button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 5px 13px; font: 500 0.85rem var(--body); cursor: pointer; }
.chips button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.choice { text-align: left; background: rgba(255,255,255,0.04); border: 1px solid var(--line); color: var(--ink); border-radius: 14px; padding: 14px 16px; font: 400 0.98rem var(--body); cursor: pointer; width: 100%; transition: background .2s, border-color .2s; }
.choice[aria-pressed="true"] { border-color: var(--rose); background: rgba(255,122,147,0.12); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.reveal-item { border-left: 3px solid var(--gold); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 2px; animation: slideIn .5s ease both; }
.reveal-item:nth-child(3) { animation-delay: .15s; }
.reveal-item:nth-child(4) { animation-delay: .3s; }
@keyframes slideIn { from { transform: translateX(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
.reveal-item.rose { border-color: var(--rose); }
.reveal-item .lbl { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.reveal-item .val { font-family: var(--display); font-size: 1.12rem; line-height: 1.3; }
.verdict { font-weight: 700; font-family: var(--body); font-size: 0.95rem; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.q { display: flex; flex-direction: column; gap: 8px; }
.q p { margin: 0; font-weight: 500; }
.yn { display: flex; gap: 8px; }
.yn button { flex: 1; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 12px; padding: 11px; font: 500 0.95rem var(--body); cursor: pointer; }
.yn button[aria-pressed="true"] { background: var(--gold); color: var(--sky); border-color: var(--gold); }
.yn button:disabled { cursor: default; }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score div { border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
.score b { display: block; font-family: var(--display); font-size: 2rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.score span { font-size: 0.8rem; color: var(--muted); }
.breakdown { margin: 0; padding: 0; list-style: none; font-size: 0.9rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.breakdown li { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.note { background: rgba(255,122,147,0.1); border-radius: 12px; padding: 10px 12px; font-size: 0.88rem; color: var(--ink); margin: 0; }
.err { color: var(--bad); font-size: 0.88rem; margin: 0; min-height: 1.2em; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font: 400 0.88rem var(--body); cursor: pointer; padding: 6px; align-self: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 0.85rem; color: var(--muted); }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.switch { width: 50px; height: 28px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.08); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: rgba(240,198,116,0.25); }
.switch[aria-checked="true"]::after { transform: translateX(22px); background: var(--gold); }
.btnrow { display: flex; gap: 8px; }
.btnrow .btn { padding: 11px 12px; font-size: 0.9rem; }
.filelbl { display: block; text-align: center; }
.filelbl input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* Toast + modal */
.toast { position: fixed; left: 50%; top: 16px; transform: translate(-50%, -140%); z-index: 60; background: #241e48; border: 1px solid var(--gold); color: var(--ink); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 32px -10px rgba(0,0,0,0.7); transition: transform .45s cubic-bezier(.2,.9,.3,1.2); max-width: calc(100% - 32px); }
.toast.show { transform: translate(-50%, 0); }
.toast .ic { font-size: 1.6rem; }
.toast small { display: block; color: var(--gold); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(6,5,16,0.96); display: grid; place-items: center; padding: 18px; overflow-y: auto; }
.modal-in { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; animation: unfold .45s ease; }
.modal img { width: 100%; border-radius: 16px; border: 1px solid var(--line); display: block; }
.screen { animation: enter .35s ease; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
/* Online couple */
.status { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: breathe 2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.25); } }
.partner-line { margin: 0; font-size: 0.95rem; }
.partner-line .em { font-size: 1.15rem; }
.listen { color: var(--gold); font-size: 0.9rem; }
.moods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mood { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: var(--ink); font: 400 0.7rem var(--body); cursor: pointer; text-align: center; line-height: 1.2; }
.mood span { font-size: 1.5rem; }
.mood[aria-pressed="true"] { border-color: var(--gold); background: rgba(240,198,116,0.12); }
.mood:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.duel { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; text-align: center; }
.duel b { font-family: var(--display); font-size: 1.2rem; color: var(--gold); font-weight: 500; }
.fxlayer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; text-align: center; pointer-events: none; }
.fxlayer p { font-family: var(--display); font-size: 1.6rem; margin: 16px 0 0; text-shadow: 0 2px 16px rgba(0,0,0,0.8); padding: 0 24px; text-wrap: balance; }
#heartfx { background: radial-gradient(circle at 50% 50%, rgba(13,11,31,0.9) 0, rgba(13,11,31,0.6) 35%, rgba(13,11,31,0) 70%); }
#heartfx svg { width: 160px; height: 160px; filter: drop-shadow(0 0 30px rgba(255,122,147,0.8)); animation: beat 1.6s ease-in-out both; }
#heartfx > div { animation: fadeOut 2.6s ease both; }
@keyframes beat { 0% { transform: scale(0.2); } 20% { transform: scale(1.15); } 32% { transform: scale(0.95); } 46% { transform: scale(1.2); } 60%,100% { transform: scale(1); } }
@keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
#moonfx { background: radial-gradient(80% 60% at 50% 40%, rgba(42,34,87,0.95), rgba(8,6,20,0.98)); pointer-events: auto; cursor: pointer; }
#moonfx .bigmoon { width: 170px; height: 170px; border-radius: 50%; margin: 0 auto; background: radial-gradient(circle at 35% 35%, #fff3d0, #f0c674 60%, #c99a3f); box-shadow: 0 0 80px 10px rgba(240,198,116,0.5); animation: rise 2.2s cubic-bezier(.2,.8,.2,1) both; }
#moonfx p { animation: enter 1s ease 1s both; }
@keyframes rise { from { transform: translateY(45vh) scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
/* Modes, daily, story, synchro */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modetile { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px; color: var(--ink); font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: background .2s, box-shadow .2s; }
.modetile b { font-family: var(--display); font-size: 1.1rem; font-weight: 500; }
.modetile span { font-size: 0.82rem; color: var(--muted); line-height: 1.3; }
.modetile[aria-pressed="true"] { border-color: var(--gold); background: rgba(240,198,116,0.1); box-shadow: inset 0 0 0 1px var(--gold); }
.modetile:focus-visible, .vs:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.rowb { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.daily-text { font-family: var(--display); font-size: 1.25rem; line-height: 1.3; margin: 0; text-wrap: balance; }
.big-days { font-family: var(--display); font-size: 2.1rem; color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums; }
.story-line { margin: 0; font-size: 0.95rem; }
.versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.vs { min-height: 112px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--ink); font: 500 1.2rem var(--display); cursor: pointer; padding: 12px; transition: transform .15s, background .2s, border-color .2s, box-shadow .2s; text-wrap: balance; }
.vs[aria-pressed="true"] { background: var(--gold); color: var(--sky); border-color: var(--gold); transform: scale(1.03); }
.vs.partner { box-shadow: 0 0 0 3px var(--rose); }
.vs:disabled { cursor: default; }
.or { font-family: var(--display); font-style: italic; color: var(--muted); }
.streak { display: flex; gap: 10px; justify-content: center; }
.streak i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--gold); display: block; transition: background .3s, box-shadow .3s; }
.streak i.on { background: var(--gold); box-shadow: 0 0 12px rgba(240,198,116,0.7); }
.result { font-family: var(--display); font-size: 1.4rem; margin: 0; }

/* Call bar */
.callbar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 65; width: min(420px, calc(100% - 24px)); background: #241e48; border: 1px solid var(--gold); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 16px 40px -12px rgba(0,0,0,0.8); }
.callbar.ringing { animation: ringglow 1.2s ease-in-out infinite; border-color: var(--rose); }
@keyframes ringglow { 50% { box-shadow: 0 0 34px -2px rgba(255,122,147,0.75); } }
.cb-info { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.cb-info .cb-time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--gold); }
.cb-btns { display: flex; gap: 8px; }
.cb-btns .btn { padding: 11px 10px; font-size: 0.92rem; }
body.incall .wrap { padding-bottom: 150px; }
a.btn { display: block; text-decoration: none; text-align: center; }
/* Goodnight: the moon crosses the screen */
#moonx { position: fixed; inset: 0; z-index: 85; overflow: hidden; cursor: pointer; background: radial-gradient(90% 70% at 50% 40%, rgb(30,24,66), rgb(8,6,20)); }
#moonx .xmoon { position: absolute; left: 50%; top: 42%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3d0, #f0c674 60%, #c99a3f); box-shadow: 0 0 60px 12px rgba(240,198,116,0.55), 0 0 160px 50px rgba(240,198,116,0.16); animation: cross 5.4s cubic-bezier(.45,.05,.55,.95) both; }
@keyframes cross { 0% { transform: translate(-80vw, 24vh) scale(0.55); opacity: 0; } 12% { opacity: 1; } 50% { transform: translate(0, -10vh) scale(1); } 88% { opacity: 1; } 100% { transform: translate(80vw, 24vh) scale(0.55); opacity: 0; } }
#moonx p { position: absolute; left: 0; right: 0; top: 60%; margin: 0; padding: 0 24px; text-align: center; font-family: var(--display); font-size: 1.75rem; line-height: 1.25; text-wrap: balance; color: var(--ink); text-shadow: 0 2px 18px rgba(0,0,0,0.8); animation: gnText 5.4s ease both; }
@keyframes gnText { 0%, 22% { opacity: 0; transform: translateY(10px); } 38%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#moonx .twk { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twk 1.8s ease-in-out infinite; }
#moonx .twk.g { background: var(--gold); }
@keyframes twk { 0%, 100% { opacity: 0.15; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1.4); } }
/* Wave 1: photo, overlays, PIN */
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cphoto { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); flex: none; box-shadow: 0 0 16px -4px rgba(240,198,116,0.6); }
.cphoto.big { width: 120px; height: 120px; align-self: center; }
.ovl { position: fixed; inset: 0; z-index: 90; background: radial-gradient(90% 70% at 50% 30%, rgb(30,24,66), rgb(8,6,20)); display: grid; place-items: center; padding: 24px 20px; overflow-y: auto; }
.ovl-in { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; text-align: center; }
.ovl-in h1 { margin: 0; }
.pindots { display: flex; justify-content: center; gap: 16px; }
.pindots i { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--gold); display: block; transition: background .15s; }
.pindots i.on { background: var(--gold); }
.pindots.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 12px; }
.key { height: 62px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--ink); font: 500 1.5rem var(--display); cursor: pointer; }
.key:active { background: rgba(240,198,116,0.2); }
.key:focus-visible, .langbig:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.key.blank { visibility: hidden; }
.onb-dots { display: flex; justify-content: center; gap: 8px; }
.onb-dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); display: block; }
.onb-dots i.on { background: var(--gold); width: 22px; border-radius: 8px; }
.langbig { padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--ink); font: 500 1.05rem var(--body); cursor: pointer; }
.langbig[aria-pressed="true"] { border-color: var(--gold); background: rgba(240,198,116,0.14); }
.onb-moon { width: 96px; height: 96px; margin: 0 auto; }
.left { text-align: left; }
/* Wave 2: quiz + draw */
.choice.partner-choice { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.choice:disabled { cursor: default; }
#dr-canvas { width: 100%; aspect-ratio: 1; background: #fbf7ef; border-radius: 16px; touch-action: none; display: block; }
.dr-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--gold); }
.dr-tools .btn { width: auto; padding: 9px 14px; font-size: 0.9rem; }
.wordhint { letter-spacing: 0.35em; font-family: var(--display); font-size: 1.4rem; color: var(--gold); }
.guessrow { display: flex; gap: 8px; }
.guessrow .txt { flex: 1; }
.guessrow .btn { width: auto; padding: 12px 18px; }
/* Wave 3: letters + dreams */
.lt { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: rgba(255,255,255,0.03); }
.lt .lt-l { flex: 1; min-width: 0; }
.lt b { display: block; font-family: var(--display); font-weight: 500; font-size: 1rem; line-height: 1.3; }
.lt small { color: var(--muted); font-size: 0.8rem; }
.lt .btn { width: auto; padding: 8px 14px; font-size: 0.88rem; flex: none; }
.lt.locked { opacity: 0.75; }
.letter { white-space: pre-wrap; text-align: left; font-family: var(--display); font-size: 1.15rem; line-height: 1.55; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin: 0; max-height: 50vh; overflow-y: auto; }
textarea.txt { resize: vertical; font: 400 1rem var(--body); line-height: 1.5; }
select.txt { appearance: auto; }
.dream { display: flex; align-items: center; gap: 10px; }
.chk { width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--gold); background: none; flex: none; color: var(--sky); font-weight: 700; cursor: pointer; padding: 0; }
.chk[aria-pressed="true"] { background: var(--gold); }
.chk:focus-visible, .xdel:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.dt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.dt small { display: block; color: var(--muted); font-size: 0.75rem; }
.dream.done .dt > span { text-decoration: line-through; color: var(--muted); }
.xdel { background: none; border: 0; color: var(--muted); font-size: 1.3rem; cursor: pointer; padding: 2px 8px; line-height: 1; }
/* Wave 4: video call */
#vlayer { position: fixed; inset: 0; z-index: 64; background: #000; }
#vlayer.mini { inset: auto; right: 12px; bottom: 150px; width: 120px; height: 170px; border-radius: 16px; overflow: hidden; border: 2px solid var(--gold); box-shadow: 0 12px 30px -10px rgba(0,0,0,0.8); cursor: pointer; }
#remote-video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
#local-video { position: absolute; right: 12px; top: 12px; width: 96px; height: 136px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.7); transform: scaleX(-1); background: #111; }
#vlayer.mini #local-video, #vlayer.mini #v-size { display: none; }
#v-size { position: absolute; left: 12px; top: 12px; width: auto; padding: 9px 14px; font-size: 0.85rem; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.4); color: #fff; }
/* Weather + listen together */
.wxgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wxside { border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wxside small { color: var(--muted); font-size: 0.78rem; overflow-wrap: anywhere; }
.wxside .em { font-size: 2.1rem; display: inline-block; line-height: 1.2; }
.wxside .tp { font-family: var(--display); font-size: 1.8rem; color: var(--gold); line-height: 1.1; font-variant-numeric: tabular-nums; }
.wxside .tp small { font-family: var(--body); }
.wxside.hot { background: linear-gradient(160deg, rgba(255,154,60,0.24), rgba(255,122,147,0.06)); border-color: rgba(255,154,60,0.5); }
.wxside.cold { background: linear-gradient(160deg, rgba(120,170,255,0.24), rgba(120,170,255,0.05)); border-color: rgba(120,170,255,0.5); }
.em.sun { animation: spin 14s linear infinite; }
.em.bob { animation: bob 2.6s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ytwrap { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; }
.ytwrap iframe, .ytwrap #yt-player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
/* Navigation: header + bottom tab bar */
header { position: sticky; top: 0; z-index: 30; margin: -18px -18px 0; padding: 14px 18px 12px; background: linear-gradient(var(--sky) 70%, rgba(13,11,31,0)); min-height: 62px; }
.hdr-title { flex: 1; margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hdr-back { flex: none; width: 38px; height: 38px; }
.greet h1 { font-size: 1.9rem; margin: 2px 0 0; }
.tabtitle { font-size: 1.9rem; margin: 4px 0 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 62; display: grid; grid-template-columns: repeat(4, 1fr); max-width: 480px; margin: 0 auto; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); background: rgba(16,13,38,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(240,198,116,0.18); }
.tabbar button { background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font: 500 0.72rem var(--body); cursor: pointer; border-radius: 12px; position: relative; }
.tabbar svg { width: 25px; height: 25px; transition: transform .2s; }
.tabbar button[aria-current="page"] { color: var(--gold); }
.tabbar button[aria-current="page"] svg { transform: translateY(-1px) scale(1.08); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 3px; background: var(--gold); }
.tabbar button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.tabbar .dotnew { position: absolute; top: 4px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--rose); border: 2px solid #100d26; }
body.tabs .wrap { padding-bottom: 100px; }
body.tabs.incall .wrap { padding-bottom: 180px; }
body.tabs .callbar { bottom: calc(78px + env(safe-area-inset-bottom)); }
body.tabs #vlayer.mini { bottom: calc(230px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

  /* ================= Weather in our two cities (Open-Meteo, city name only) ================= */
  function wxKind(code) {
    if (code === 0) return 0; if (code <= 2) return 1; if (code === 3) return 2; if (code === 45 || code === 48) return 3;
    if (code >= 51 && code <= 57) return 4; if (code >= 61 && code <= 67) return 5; if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 6;
    if (code >= 80 && code <= 82) return 7; if (code >= 95) return 8; return 2;
  }
  function wxIcon(w) { var k = wxKind(w.c); if (k === 0) return w.d ? "☀️" : "🌙"; return ["☀️", w.d ? "🌤️" : "☁️", "☁️", "🌫️", "🌦️", "🌧️", "❄️", "🌧️", "⛈️"].at(k); }

    var em = document.createElement("span"); em.className = "em " + (wxKind(w.c) === 0 && w.d ? "sun" : "bob"); em.textContent = wxIcon(w); el.appendChild(em);
    var tp = document.createElement("span"); tp.className = "tp"; tp.textContent = Math.round(w.t) + " °C"; el.appendChild(tp);
    if (S.lang === "en") { var f = document.createElement("small"); f.textContent = Math.round(w.t * 9 / 5 + 32) + " °F"; el.appendChild(f); }
    var ct = document.createElement("small"); ct.textContent = (w.city || "") + " · " + t("wxD").at(wxKind(w.c)); el.appendChild(ct);
  }

  function fetchWeather() {

  /* ================= Listen together (YouTube player kept in sync through Firebase) ================= */
  var MU = { player: null, ready: false, joined: false, curId: null, ytP: null };
  function ytId(url) {
    var m = (url || "").match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
    if (m) return m[1];
    return /^[A-Za-z0-9_-]{11}$/.test((url || "").trim()) ? url.trim() : null;
  }
  function loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (MU.ytP) return MU.ytP;
    MU.ytP = new Promise(function (res) { var prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = function () { if (prev) prev(); res(); }; loadScript("https://www.youtube.com/iframe_api").catch(function () {}); });
    return MU.ytP;

  function musicOnline() { return !!(P.couple && OL.db && OL.partnerJoined); }
  function expectedPos(m) { return (m.pos || 0) + (m.state === "play" ? Math.max(0, (srvNow() - (m.at || srvNow())) / 1000) : 0); }
  function ensurePlayer(id, start) {
    return loadYT().then(function () {
      return new Promise(function (res) {
        if (MU.player && MU.ready) { MU.player.loadVideoById({ videoId: id, startSeconds: start }); res(); return; }
        MU.player = new YT.Player("yt-player", {
          videoId: id, playerVars: { start: Math.floor(start), autoplay: 1, controls: 1, playsinline: 1, rel: 0 },
          events: { onReady: function () { MU.ready = true; MU.player.seekTo(start, true); MU.player.playVideo(); res(); }, onStateChange: muStateChange }
        });
      });
    });
  }
  function muStateChange(e) {
    var m = OL.music;
    if (e && e.data === 1 && m && !m.title && m.bySlot === mySlot() && MU.player && MU.player.getVideoData) {
      var ti = (MU.player.getVideoData() || {}).title; if (ti) OL.db.ref(olBase() + "/live/shared/music/title").set(ti.slice(0, 120)).catch(function () {});
    }
  }
  function applyMusic(m, force) {
    if (!MU.joined || !m) return;
    if (!MU.player || !MU.ready || MU.curId !== m.id) {
      MU.curId = m.id;
      ensurePlayer(m.id, expectedPos(m)).then(function () { if (m.state === "pause") MU.player.pauseVideo(); });
      return;
    }
    var exp = expectedPos(m), pos = MU.player.getCurrentTime ? MU.player.getCurrentTime() : 0;
    if (m.state === "play") { if (force || Math.abs(pos - exp) > 2) MU.player.seekTo(exp, true); MU.player.playVideo(); }
    else { MU.player.pauseVideo(); if (force || Math.abs(pos - (m.pos || 0)) > 1) MU.player.seekTo(m.pos || 0, true); }
  }
  function onSharedMusic(v) {
    var prev = OL.music; OL.music = v || null;

    else if (MU.joined) applyMusic(v, false);
    else if (v.bySlot !== mySlot() && (!prev || prev.id !== v.id) && OL.musicSeen) { toast("🎧", t("muTitle"), t("muStarted")(nameStart())); notifyIfHidden("🎧 Noche Duo", t("muStarted")(nameStart()), "music"); }

  function renderMusic() {

    $("mu-now").hidden = !m;

      var who = m.bySlot === mySlot() ? (P.me || t("me")) : nameStart();

  $("mu-start").addEventListener("click", function () {

    ensurePlayer(id, 0); $("mu-url").value = ""; sfx("tap"); renderMusic();
  });
  $("mu-join").addEventListener("click", function () { MU.joined = true; sfx("tap"); renderMusic(); applyMusic(OL.music, true); });
  $("mu-toggle").addEventListener("click", function () {

  function screenTitle(n) {

  /* ================= Night sky with shooting stars ================= */
  var cv = $("stars"), cx = cv.getContext("2d"), stars = [], shoot = null, nextShoot = 2500;
  function sizeStars() {
    var dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = [];
    var n = Math.round(innerWidth * innerHeight / 5000);
    for (var i = 0; i < n; i++) stars.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.2 + 0.2, p: Math.random() * Math.PI * 2 });
    sizeFx(); drawStars(0);
  }
  function drawStars(time) {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      cx.globalAlpha = reduce ? 0.6 : 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(time / 900 + s.p));
      cx.fillStyle = i % 9 === 0 ? "#f0c674" : "#ffffff";
      cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, Math.PI * 2); cx.fill();
    }
    if (shoot) {
      var k = (time - shoot.t0) / 900;
      if (k >= 1) shoot = null;
      else {
        var x = shoot.x + shoot.dx * k, y = shoot.y + shoot.dy * k;
        var grad = cx.createLinearGradient(x, y, x - shoot.dx * 0.25, y - shoot.dy * 0.25);
        grad.addColorStop(0, "rgba(255,255,255," + (1 - k) + ")"); grad.addColorStop(1, "rgba(255,255,255,0)");
        cx.globalAlpha = 1; cx.strokeStyle = grad; cx.lineWidth = 1.6;
        cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - shoot.dx * 0.25, y - shoot.dy * 0.25); cx.stroke();
      }
    } else if (time > nextShoot) {
      shoot = { t0: time, x: Math.random() * innerWidth * 0.7, y: Math.random() * innerHeight * 0.35, dx: 260 + Math.random() * 160, dy: 120 + Math.random() * 80 };
      nextShoot = time + 5000 + Math.random() * 7000;
    }
    cx.globalAlpha = 1;
  }
  function loop(time) { if (!P.lite) drawStars(time); requestAnimationFrame(loop); }
  addEventListener("resize", sizeStars);
  sizeStars();
  if (!reduce) requestAnimationFrame(loop);
